# Désactivation de la configuration réseau gérée par cloud-init.
#
# Nom du fichier déposé par labs/scripts/10-preparer-vm.sh dans
# /etc/cloud/cloud.cfg.d/00-subiquity-disable-cloudinit-networking.cfg
# (propriétaire root, droits 644).
#
# Pourquoi ce fichier est nécessaire dans le lab :
#   cloud-init applique une configuration réseau au premier démarrage, puis peut
#   la réécrire. Or le lab exige des adresses IP fixes (172.16.0.10 et
#   172.16.0.11) et une résolution de noms stable entre tous les redémarrages. La clé
#   « network: config: disabled » désactive la génération des fichiers réseau
#   par cloud-init : /etc/netplan/99-lab.yaml devient alors la seule source de
#   vérité de l'adressage du lab.
#
# Le préfixe 00- garantit que ce réglage est appliqué avant les autres
# fichiers de cloud.cfg.d, comme le fichier 00-subiquity-user-data créé par
# l'installateur Ubuntu Server.
#
# Cette désactivation est limitée au lab de formation : en production,
# cloud-init reste le mécanisme normal de configuration réseau.
network:
  config: disabled